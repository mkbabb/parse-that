[package]
name = "bbnf-regex"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compile-time regex HIR analysis and checked table-plan emission for BBNF"
repository = "https://github.com/mkbabb/parse-that"

[lib]
name = "bbnf_regex"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
smallvec = "1.13"
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
divan = "0.1"
mimalloc = "0.1"

# ── bbnf-regex benches (Tranche P) ──────────────────────────

[[bench]]
name = "regex_parse"
harness = false

[[bench]]
name = "regex_classify"
harness = false

[[bench]]
name = "regex_dfa_compile"
harness = false
