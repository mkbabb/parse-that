[package]
name = "parse-that-regex"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Regex engine for parser generators: HIR, NFA→DFA compilation, e-graph simplification, structural classification"
repository = "https://github.com/mkbabb/parse-that"

[lib]
name = "parse_that_regex"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
smallvec = "1.13"
serde = { version = "1", optional = true, features = ["derive"] }
# AZ-IV.W2.3 — `path_lexer` exposes a custom HIR API for path-string
# literals. Tokens carry `proc_macro2::Span` so the consuming `path!`
# proc-macro (bbnf-path, AZ-IV.W2.4) can anchor diagnostics at the macro
# call-site. proc-macro2 is callable from both proc-macro contexts and
# ordinary library/test contexts under its default features.
proc-macro2 = "1"
# Tranche X phase 2: FxHash for the per-iteration scratch state in
# the HIR e-graph rewrite rules. Same hash strategy as the egraph
# substrate crate (via rustc-hash 2).
rustc-hash = "2"
# Tranche H: HIR e-graph substrate. `parse-that-egraph` +
# `parse-that-egraph-derive` supply the equality-saturation machinery and
# its CSP scheduler (which brings csp-solver with it). Workspace members:
# path edges with the version each will take on crates.io.
parse-that-egraph = { version = "0.1.0", path = "../egraph" }
parse-that-egraph-derive = { version = "0.1.0", path = "../egraph-derive" }

[dev-dependencies]
divan = "0.1"
mimalloc = "0.1"
serde_json = "1"
# sk-v27 LW2.RX-1 (OR-7 spike, Route A only): regex-automata as the
# determinizer, at the version the workspace lock already resolves.
regex-automata = "=0.4.14"
regex-syntax = "=0.8.10"

# ── parse-that-regex benches (Tranche P) ──────────────────────────

[[bench]]
name = "regex_parse"
harness = false

[[bench]]
name = "regex_classify"
harness = false

[[bench]]
name = "regex_hir_egraph"
harness = false

[[bench]]
name = "regex_dfa_compile"
harness = false
