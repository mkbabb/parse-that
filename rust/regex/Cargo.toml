[package]
name = "bbnf-regex"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bespoke regex engine: HIR, NFA→DFA compilation, structural classification"
repository = "https://github.com/mkbabb/parse-that"

[lib]
name = "bbnf_regex"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
smallvec = "1.13"
serde = { version = "1", optional = true, features = ["derive"] }
# Tranche H: HIR e-graph substrate. `egraph` + `egraph-derive` supply the
# equality-saturation machinery; `csp-solver` schedules HIR rewrite
# eligibility the same way the grammar tier schedules its CSP passes. All
# three are resolved locally via parse-that/rust/.cargo/config.toml's
# [patch.crates-io] table — no published crate coordinates required.
egraph = "0.1"
egraph-derive = "0.1"
csp-solver = "0.1"
