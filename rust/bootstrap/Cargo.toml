[package]
name = "regex-bootstrap"
version = "0.1.1"
edition = "2024"
publish = false
description = "Diagnostic re-export: surfaces parse_that::regex's self-hosted parser for the regex_parse divan bench."

[[bench]]
name = "regex_parse"
harness = false

[dependencies]
# The derive host this crate once was is retired upstream: the parser
# generator's proc-macro crate is gone, so the historical registry edge that
# expanded `RegexParser` from the regex grammar is gone too. The generated
# parser now lives at `parse_that::regex::generated` (committed source); this
# crate is a thin re-export that preserves the `regex_bootstrap::*`
# benchmark surface without re-running a proc-macro.
#
# The generator's own bootstrap crate is the analogous diagnostic re-export
# of its emitted parser.
parse_that = { path = "../parse_that" }

[dev-dependencies]
divan = "0.1"
mimalloc = "0.1"
