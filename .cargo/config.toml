# .cargo/config.toml — parse-that sibling repo
#
# Mirrors bbnf-lang's toolchain posture so cross-repo path-patched
# builds (bbnf-regex + parse_that pulled into bbnf-lang's Cargo.toml
# via [patch.crates-io]) observe the same rustflags + ax-iter profile.
# Source of truth for pin is bbnf-lang's rust-toolchain.toml (mirrored
# into this repo as a same-date twin per B1.W2.c propagation).

[build]
rustflags = ["-Zthreads=8", "-Zshare-generics=y"]

# macOS arm64: default system ld64 via clang. lld is opt-in; developers
# who want it must `brew install lld` (separate formula from llvm) and
# uncomment the block below, adjusting the path from `brew --prefix lld`.
[target.aarch64-apple-darwin]
rustflags = ["-Zthreads=8", "-Zshare-generics=y"]

# Opt-in lld (requires `brew install lld`):
# [target.aarch64-apple-darwin]
# linker    = "clang"
# rustflags = [
#     "-C", "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld.lld",
#     "-Zthreads=8",
#     "-Zshare-generics=y",
# ]

# Linux x86_64: bundled rust-lld, no extra install.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-Zthreads=8",
    "-Zshare-generics=y",
]

# ── Profiles ────────────────────────────────────────────────────────────────
# Three-tier surface mirrored from bbnf-lang's .cargo/config.toml so cross-
# repo path-patched builds observe identical profile semantics:
#   * ax-iter  — dev-loop iteration (fast compile, minimal debuginfo).
#   * ay-final — release tier for correctness benches + publishable binaries.
#   * bench-ci — iai-callgrind under valgrind on Linux CI; full debuginfo,
#                no LTO (valgrind instruments un-LTO'd IR).

[profile.ax-iter]
inherits      = "dev"
opt-level     = 0
debug         = "line-tables-only"
incremental   = true
codegen-units = 256

# ay-final: release profile tuned for correctness benchmarks and publishable
# binaries (parse-that bench parity, regex DFA codegen). Fat LTO + single
# codegen unit. Mirrors bbnf-lang's [profile.ay-final].
[profile.ay-final]
inherits        = "release"
lto             = "fat"
codegen-units   = 1
debug           = 1                   # keep samply-resolvable symbols
strip           = false
split-debuginfo = "packed"

# bench-ci: for iai-callgrind runs under valgrind on Linux CI. Full
# debuginfo (callgrind needs it for source attribution) and no LTO
# (valgrind instruments the un-LTO'd IR). Mirrors bbnf-lang's
# [profile.bench-ci].
[profile.bench-ci]
inherits        = "release"
debug           = "full"
lto             = "off"
codegen-units   = 1

[alias]
iter-check = "check --profile ax-iter"
iter-test  = "nextest run --cargo-profile ax-iter"
# `cargo xtask corpus fetch|verify|pack|dir` (from rust/): corpus custody, corpus/MANIFEST.sha256.
xtask      = "run -p xtask --"

# ── Patches (CB-1a, sk-v27 LW1.COMP-4 extended to this repo at the LW1 lockstep gate) ──
# bbnf-regex depends on egraph, egraph-derive and csp-solver, which live in
# bbnf-lang and are not on crates.io until ruling X-5's leaf move (LW2.TOPO-1)
# and the LW6 publish. They enter as git + rev edges pinned to a pushed
# bbnf-lang rev (LW2.TOPO-7: the first rev without the private docs/precepts
# submodule, so the edge resolves credential-free), so a clean clone resolves
# with no sibling checkout and no path that leaves the repository. Moving the pin is one commit that edits
# the rev here and the lockfile. To develop against a local bbnf-lang, override
# outside the repository (~/.cargo/config.toml or `cargo --config`).
[patch.crates-io]
egraph        = { git = "https://github.com/mkbabb/bbnf-lang", rev = "1874fa3f8db8d007ae82fb2582636b30b02546e2" }
egraph-derive = { git = "https://github.com/mkbabb/bbnf-lang", rev = "1874fa3f8db8d007ae82fb2582636b30b02546e2" }
csp-solver    = { git = "https://github.com/mkbabb/bbnf-lang", rev = "1874fa3f8db8d007ae82fb2582636b30b02546e2" }
# pprint enters at the same rev bbnf-lang pins (CB-1a, 048a8e622), so the
# whole pprint -> parse-that -> bbnf-lang DAG resolves one pprint.
pprint        = { git = "https://github.com/mkbabb/pprint", rev = "2b4d2d48657ebc4eb4c23297929ad3532e3eb6b4" }
pprint_derive = { git = "https://github.com/mkbabb/pprint", rev = "2b4d2d48657ebc4eb4c23297929ad3532e3eb6b4" }
