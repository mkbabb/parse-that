[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[profile.ax-iter]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.ay-final]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 1
strip = false
split-debuginfo = "packed"

[profile.bench-ci]
inherits = "release"
debug = "full"
lto = "off"
codegen-units = 1

[alias]
iter-check = "check --profile ax-iter"
iter-test = "nextest run --cargo-profile ax-iter"
