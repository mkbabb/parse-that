name: CI

on:
  push:
    branches: [master, modernize]
  pull_request:
    branches: [master]

# sk-v27 LW2.TOPO-3: the arm set is macos-15 (for the order's macos-14) and ubuntu-latest on the pinned
# stable toolchain (rust-toolchain.toml), a `cargo +stable` job on the latest
# stable, the opt-in nightly plane, and an Intel SDE job for AVX-512. `ci-ok`
# needs every job and is the one required check. The build wrapper is set
# here, never in .cargo/config.toml (LW2.TOPO-2).

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npx tsc --noEmit
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm run build
        working-directory: typescript

  rust:
    name: Rust (${{ matrix.os }}) — clippy + nextest
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (Apple silicon, NEON): GitHub no longer serves macos-14
        # ("The configuration 'macos-14-arm64-us-default' is not supported",
        # pprint run 42732073134); the order's macos-14 arm reads here.
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (the rust-toolchain.toml pin, stable)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: clippy -D warnings (all targets)
        run: cargo clippy --profile ax-iter --workspace --all-targets -- -D warnings
        working-directory: rust
      # The test corpus is the release asset named in corpus/MANIFEST.sha256,
      # fetched over public HTTPS with no token and checked file by file
      # before any test reads it.
      - name: corpus — fetch and verify (release asset, sha256 manifest)
        run: cargo xtask corpus fetch
        working-directory: rust
      # `--cargo-profile ax-iter` selects the cargo build profile defined
      # in .cargo/config.toml (parse-that has no .config/nextest.toml; the
      # nextest runner uses its built-in `default` profile).
      - name: workspace tests (nextest, ax-iter)
        run: cargo nextest run --cargo-profile ax-iter --workspace --no-fail-fast
        working-directory: rust
      - name: workspace tests with diagnostics (nextest, ax-iter)
        run: cargo nextest run --cargo-profile ax-iter --workspace --features diagnostics --no-fail-fast
        working-directory: rust
      # nextest does not run doctests; the audited library crates' doctests
      # are callers of record for tests/public_api_callers.rs (ruling A-2).
      - name: doctests (parse-that-egraph, parse-that-egraph-derive, parse-that-simd)
        run: cargo test --profile ax-iter --doc -p parse-that-egraph -p parse-that-egraph-derive -p parse-that-simd
        working-directory: rust

  stable:
    # The LW1.PERF-2 command on the latest stable release: the forward arm of
    # the pin, so a new stable that breaks the build is read before the pin
    # moves.
    name: Rust — cargo +stable (latest)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo +stable --version
      - run: cargo +stable build --release --locked
        working-directory: rust
      - run: cargo +stable xtask corpus fetch
        working-directory: rust
      - run: cargo +stable test --workspace --locked --no-fail-fast
        working-directory: rust

  nightly-plane:
    # The opt-in plane (parse_that feature `nightly`: portable-SIMD scan
    # kernels, smallbox coercion) on the nightly the programme last pinned,
    # through the alias family in .cargo/config.toml. The scan suites run on
    # both planes; tests/lanes_test.rs holds each plane to the scalar
    # definition.
    name: Rust — nightly plane (parse_that/nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-11
          components: clippy
      - name: clippy -D warnings (nightly plane)
        run: cargo +nightly-2026-04-11 clippy -p parse_that --features nightly --lib --tests -- -D warnings
        working-directory: rust
      - name: scan suites (nightly plane)
        run: cargo +nightly-2026-04-11 test -p parse_that --features nightly --locked --lib --test lanes_test --test structural_bitmap_test --test quoted_simd_test --test quote_parity_test --test ws_comment_test --test decode_test --test number_simd_test --test number_fastpath_test --test padded_input_test
        working-directory: rust

  sde:
    # Intel SDE (Sapphire Rapids) executes the scan suites compiled for that
    # CPU on both planes, so every AVX-512 instruction the compiler emits for
    # the kernels runs on an emulated part that has the ISA (ruling X-4: an
    # x86 tier is executed in CI). `--target` keeps RUSTFLAGS off build
    # scripts and proc macros, which run natively on the runner.
    name: Rust — Intel SDE (AVX-512, sapphirerapids)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-cpu=sapphirerapids
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (the rust-toolchain.toml pin, stable)
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-04-11 --profile minimal
          rustc --version
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      - name: scan suites under SDE (stable plane)
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE_PATH/sde64 -spr --"
          cargo test --target x86_64-unknown-linux-gnu -p parse_that --locked --lib --test lanes_test --test structural_bitmap_test --test quoted_simd_test --test quote_parity_test --test ws_comment_test --test decode_test --test number_simd_test --test number_fastpath_test --test padded_input_test
        working-directory: rust
      - name: scan suites under SDE (nightly plane)
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE_PATH/sde64 -spr --"
          cargo +nightly-2026-04-11 test --target x86_64-unknown-linux-gnu -p parse_that --features nightly --locked --lib --test lanes_test --test structural_bitmap_test --test quoted_simd_test --test quote_parity_test --test ws_comment_test --test decode_test --test number_simd_test --test number_fastpath_test --test padded_input_test
        working-directory: rust
      # parse-that-simd on a default build (no target-cpu): the runtime
      # dispatch must select the AVX-512 tier on the emulated part, and its
      # kernel meets the scalar oracle there (LW2.PERF-1, X-4).
      - name: corpus — fetch and verify (parse-that-simd correctness suite)
        run: cargo xtask corpus fetch
        working-directory: rust
        env:
          RUSTFLAGS: ""
      - name: parse-that-simd suites under SDE (default build, runtime dispatch)
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$SDE_PATH/sde64 -spr --"
          cargo test --target x86_64-unknown-linux-gnu -p parse-that-simd --locked --no-fail-fast --lib --tests -- --nocapture
        working-directory: rust
        env:
          RUSTFLAGS: ""

  kernel-asan:
    # sk-v27 LW3.COMP-1a unsafe law: the kernel's law files that hold
    # `unsafe` (the counting global allocators of kernel_allocation and
    # kernel_regex) under AddressSanitizer, with every kernel law beside them.
    name: Rust — kernel laws under ASan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-11
          components: rust-src
      - name: kernel laws, -Zsanitizer=address
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: cargo +nightly-2026-04-11 test -Zbuild-std --target x86_64-unknown-linux-gnu -p parse_that --locked --test kernel --test kernel_allocation --test kernel_regex --test kernel_abi
        working-directory: rust

  wasm:
    # parse-that-simd's SIMD128 tier on wasm32-wasip1 under Node's WASI
    # (scripts/wasi-run.mjs). wasm has no runtime feature detection, so the
    # tier exists only in a build that enables simd128.
    name: Rust — wasm32 SIMD128 (parse-that-simd, Node WASI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (the rust-toolchain.toml pin, stable) + wasm32-wasip1
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1
          rustc --version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: corpus — fetch and verify
        run: cargo xtask corpus fetch
        working-directory: rust
      - name: parse-that-simd suites on wasm32 (simd128)
        run: |
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="node --no-warnings $PWD/scripts/wasi-run.mjs"
          export PARSE_THAT_CORPUS_DIR="$PWD/../data"
          RUSTFLAGS="-C target-feature=+simd128" cargo test -p parse-that-simd --locked --no-fail-fast --target wasm32-wasip1 --lib --tests -- --nocapture
        working-directory: rust
      - name: parse-that-simd builds on wasm32 without simd128 (scalar only)
        run: cargo check -p parse-that-simd --locked --target wasm32-wasip1
        working-directory: rust

  hermetic:
    # sk-v27 LW2.TOPO-1: a fresh checkout, with no sibling repositories and no
    # credentials, resolves and builds the workspace from its pinned edges, and
    # the three-repository crate graph is a DAG (ruling X-5).
    name: Rust — repo DAG + hermetic clean-clone build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: toolchain (the rust-toolchain.toml pin, stable)
        run: |
          rustup toolchain install
          rustc --version
      - name: repo DAG (pprint <- parse-that <- bbnf-lang)
        run: sh scripts/check-repo-dag.sh
      - name: hermetic build
        run: sh scripts/check-hermetic-build.sh

  ci-ok:
    # The one required check: every arm above, by name.
    name: ci-ok
    if: always()
    needs: [typescript, rust, stable, nightly-plane, kernel-asan, sde, wasm, hermetic]
    runs-on: ubuntu-latest
    steps:
      - name: every arm succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
